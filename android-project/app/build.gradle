plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ucnmqz.callsimulator'
    compileSdk 34

    defaultConfig {
        applicationId "com.ucnmqz.callsimulator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
